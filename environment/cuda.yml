channels:
  - conda-forge
dependencies:
  # The conda-forge CUDA 12.4 toolchain requires GCC < 13. CUDA is
  # intentionally installed here instead of relying on /usr/local/cuda.
  - python=3.11
  - c-compiler=1.7
  - cxx-compiler=1.7
  - fortran-compiler=1.7
  - cuda-version=12.4
  - cuda-nvcc=12.4
  - cuda-cudart-dev=12.4

  # Build system
  - autoconf
  - autoconf-archive
  - automake
  - libtool
  - make
  - pkg-config
  - swig
  - ccache
  - cmake
  - ninja

  # Native Meep dependencies
  - fftw
  - gsl
  - hdf5
  - zlib
  - libblas
  - liblapack
  - libctl=4.7.1
  - harminv=1.4.3
  - mpb=1.12

  # Python interface and focused validation tests
  - numpy<3
  - scipy
  - h5py
  - autograd
  - jax
  # Adjoint tests use JAX for automatic differentiation on the host. Selecting
  # the CPU build avoids pulling a second CUDA toolchain into this environment.
  - jaxlib=*=cpu*
  - matplotlib-base
  - parameterized
  - pytest
  - nlopt
  - trimesh
  - gdstk=1.0.1
